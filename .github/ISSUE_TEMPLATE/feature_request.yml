name: Feature request
description: Suggest an addition or a change
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to build?
      description: The use case (board, form builder, file tree, playlist…) and what blocks you today.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like to see?
      description: A template or API sketch helps. Existing props, events and slots keep their behaviour, so new behaviour is added as an opt-in option.
    validations:
      required: true
