name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Format, lint, typecheck, test, build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check

  vue-matrix:
    name: Vue ${{ matrix.vue }}
    runs-on: ubuntu-latest
    needs: check
    strategy:
      matrix:
        vue: ['3.2.47', '3.3.13', '3.4.38']
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Pins vue, @vue/* and (below 3.5) @vue/test-utils 2.4.6 in a copy, then runs core + compat.
      - run: node scripts/sandbox-verify.mjs && node scripts/vue-matrix.mjs ${{ matrix.vue }}

  smoke:
    name: Drop-in smoke (Vite, esbuild, Rollup, webpack 5)
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm smoke

  e2e:
    name: Playwright (Chromium, Firefox, WebKit, mobile)
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir playground exec playwright install --with-deps
      - run: pnpm test:e2e
        env:
          CI: 'true'
      - run: pnpm --dir playground-nuxt exec playwright test
        env:
          CI: 'true'
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playground/playwright-report
            playground-nuxt/playwright-report
          retention-days: 7

  nuxt:
    name: Nuxt module (registration, production build, Nuxt 3.13 / 3.21 / 4.6)
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm --filter @vue-draggable/nuxt run verify:nuxt
      - run: pnpm nuxt-compat
